    <div id="root" class="min-h-screen w-full flex flex-col"></div>
    <script>
      // Self-healing: If the app hasn't mounted after 3 seconds (often due to missing chunk / stale SW cache),
      // clear service workers and reload.
      window.addEventListener('load', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.innerHTML.trim() === '') {
            console.warn('[Self-Healing] Root is empty after 3 seconds. Clearing service workers and reloading...');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                  registration.unregister();
                }
                window.location.reload(true);
              });
            } else {
              window.location.reload(true);
            }
          }
        }, 3000);
      });
    </script>
